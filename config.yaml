gpu:
  device: "cpu" # "cuda" or "cpu"

serial:
  port: "/dev/ttyACM0"
  baudrate: 115200

camera:
  index: "/dev/video0" # device path or numeric index (tried first)
  width: 1280
  height: 960
  max_reconnect_attempts: 5
  flush_frames: 1
  calib_path: "camera_calibration.json"
  extr_path: "camera_extrinsics.json"

output:
  directory: "thread_v2_snaps"
  image_retention_seconds: 345600 # 24 hours
  cleanup_interval: 3600 # 1 hour

database:
  insert_interval: 2.0 # seconds

processing:
  capture_interval: 2.0 # seconds
  min_distance_change_mm: 5.0
  capture_queue_maxsize: 1
  seg_outer_edge_max_steps: 200

edge_detection:
  canny_low: 50
  canny_high: 180
  blur_kernel: 7
  dilate_kernel: 3
  roi_top_fraction: 0.0
  roi_bottom_fraction: 1.0
  roi_left_fraction: 0.0
  roi_right_fraction: 0.9
  envelope_smooth_kernel: 5

ideal_ranges:
  seam_allowance_mm_min: 5.0
  seam_allowance_mm_max: 8.0
  stitch_length_mm_min: 2.6
  stitch_length_mm_max: 4.4

units:
  mm_per_pixel: 0.1111

classes:
  stitch: 0
  edge: 2

machine:
  id: "fabric_inspection_l01"

